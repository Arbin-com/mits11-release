name: Retention (develop)

on:
  schedule:
    - cron: '0 3 * * 1' # weekly, Monday 03:00 UTC
  workflow_dispatch: {}

env:
  DEVELOP_REPO: Arbin-com/MITS11-develop
  # Flip to 'false' once a dry-run cycle's log has been reviewed.
  DRY_RUN: 'false'
  DEV_FLOOR: 3
  DEV_CEILING_DAYS: 7
  ALPHA_FLOOR: 14
  ALPHA_CEILING_DAYS: 60
  # Caps actual deletions per run so the first cleanup (hundreds of releases
  # already past their ceiling) trickles out over several runs instead of
  # all at once. Every eligible release still gets logged each run either
  # way (as DELETE or, once the cap is hit, SKIPPED) - this only throttles
  # the mutating calls.
  MAX_DELETIONS_PER_RUN: 50

jobs:
  prune:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Prune old MITS11-develop releases
        env:
          # Fine-grained PAT scoped to contents:write on Arbin-com/MITS11-develop only.
          # This repo's own GITHUB_TOKEN cannot reach across repos, so `gh api` calls
          # against $DEVELOP_REPO use this instead. Committing/pushing manifest
          # deletions in *this* repo still goes through the checkout action's own
          # GITHUB_TOKEN, set up automatically above.
          GH_TOKEN: ${{ secrets.DEVELOP_REPO_TOKEN }}
        run: |
          set -euo pipefail

          # Named variants (variants.json, see VARIANTS.md) keep their own pointer
          # files under <variant>/, so those are protected too.
          VARIANTS_JSON=$(jq -c '[.variants[].name]' variants.json)
          POINTER_FILES=""
          for DIR in . $(echo "$VARIANTS_JSON" | jq -r '.[]'); do
            # alpha-<line> (alpha-8.1) is the alpha channel's per-line pointer.
            for POINTER in "$DIR"/stable "$DIR"/candidate "$DIR"/alpha "$DIR"/alpha-[0-9]* "$DIR"/nightly; do
              [ -f "$POINTER" ] && POINTER_FILES="$POINTER_FILES $POINTER"
            done
          done
          PROTECTED_VERSIONS="$(cat /dev/null $POINTER_FILES | sort -u)"
          # GitHub's own "Latest release" (whatever /releases/latest resolves to -
          # newest non-prerelease, non-draft, or whatever was explicitly marked
          # via make_latest) is never a delete candidate, on top of the channel
          # pointer files above. 404s (e.g. no non-prerelease release exists yet)
          # are fine - just means there's nothing extra to protect here.
          # gh writes the error body to stdout even on a 404, so -q would
          # otherwise get "applied" to that and silently produce garbage -
          # only trust the output when the call actually succeeded.
          LATEST_TAG=""
          if LATEST_RESP=$(gh api "repos/$DEVELOP_REPO/releases/latest" 2>/dev/null); then
            LATEST_TAG=$(echo "$LATEST_RESP" | jq -r '.tag_name')
          fi
          if [ -n "$LATEST_TAG" ]; then
            PROTECTED_VERSIONS="$(printf '%s\n%s\n' "$PROTECTED_VERSIONS" "$LATEST_TAG" | sort -u)"
          fi
          is_protected() {
            printf '%s\n' "$PROTECTED_VERSIONS" | grep -qxF "$1"
          }

          NOW_EPOCH=$(date -u +%s)

          RELEASES=$(gh api "repos/$DEVELOP_REPO/releases" --paginate \
            -q '.[] | {tag: .tag_name, id: .id, created_at: .created_at, size: ([.assets[].size] | add // 0)}')

          # Classify every release into a group key ("alpha" or "dev:<branch>"); anything
          # else (stable/release/patch tags, or an unrecognized shape) is left alone.
          # A named variant's tag carries the variant as its first build identifier
          # (x.y.z-alpha+mp257.build.<stamp>): it is classified as if the variant
          # were absent, its group is prefixed with "<variant>:" so variants never
          # share a floor, and its manifest lives in <variant>/<tag>.
          CLASSIFIED=$(echo "$RELEASES" | jq -c --argjson variants "$VARIANTS_JSON" '
            ([.tag | capture("\\+(?<v>[a-z0-9-]+)\\.build\\.")] | .[0].v // null) as $candidate
            | (if $candidate != null and ($variants | index($candidate)) != null then $candidate else null end) as $variant
            | (if $variant then (.tag | sub("\\+" + $variant + "\\."; "+")) else .tag end) as $shape
            | (if $variant then $variant + ":" else "" end) as $prefix
            | . + {dir: (if $variant then $variant + "/" + .tag else .tag end)}
            | . + (
              if ($shape | test("-alpha\\+build\\.")) then {class: "alpha", group: ($prefix + "alpha")}
              elif ($shape | test("-dev\\.[^+]+\\+build\\.")) then
                {class: "dev", group: ($prefix + "dev:" + ($shape | capture("-dev\\.(?<branch>[^+]+)\\+build\\.").branch))}
              else
                {class: "skip", group: null}
              end
            )
          ')

          DELETE_COUNT=0

          echo "$CLASSIFIED" | jq -s 'group_by(.group) | map(select(.[0].group != null))' | \
          jq -c '.[]' | while read -r group_json; do
            GROUP_NAME=$(echo "$group_json" | jq -r '.[0].group')
            CLASS=$(echo "$group_json" | jq -r '.[0].class')
            if [ "$CLASS" = "alpha" ]; then
              FLOOR=$ALPHA_FLOOR; CEILING_DAYS=$ALPHA_CEILING_DAYS
            else
              FLOOR=$DEV_FLOOR; CEILING_DAYS=$DEV_CEILING_DAYS
            fi

            # newest first
            SORTED=$(echo "$group_json" | jq -c 'sort_by(.created_at) | reverse')
            COUNT=$(echo "$SORTED" | jq 'length')

            for i in $(seq 0 $((COUNT - 1))); do
              ITEM=$(echo "$SORTED" | jq -c ".[$i]")
              TAG=$(echo "$ITEM" | jq -r '.tag')
              DIR=$(echo "$ITEM" | jq -r '.dir')
              ID=$(echo "$ITEM" | jq -r '.id')
              CREATED=$(echo "$ITEM" | jq -r '.created_at')
              SIZE=$(echo "$ITEM" | jq -r '.size')

              if is_protected "$TAG"; then
                echo "KEEP  (pointer)  $TAG"
                continue
              fi
              if [ "$i" -lt "$FLOOR" ]; then
                echo "KEEP  (floor $((i + 1))/$FLOOR, $GROUP_NAME)  $TAG"
                continue
              fi

              CREATED_EPOCH=$(date -u -d "$CREATED" +%s)
              AGE_DAYS=$(( (NOW_EPOCH - CREATED_EPOCH) / 86400 ))
              if [ "$AGE_DAYS" -le "$CEILING_DAYS" ]; then
                echo "KEEP  (age ${AGE_DAYS}d <= ${CEILING_DAYS}d ceiling)  $TAG"
                continue
              fi

              if [ "$DRY_RUN" = "true" ]; then
                echo "DELETE  (age ${AGE_DAYS}d, group $GROUP_NAME, $((SIZE / 1024 / 1024))MB)  $TAG"
                continue
              fi

              if [ "$DELETE_COUNT" -ge "$MAX_DELETIONS_PER_RUN" ]; then
                echo "SKIP  (cap $MAX_DELETIONS_PER_RUN/run reached, age ${AGE_DAYS}d, group $GROUP_NAME)  $TAG"
                continue
              fi

              echo "DELETE  (age ${AGE_DAYS}d, group $GROUP_NAME, $((SIZE / 1024 / 1024))MB)  $TAG"
              if gh api -X DELETE "repos/$DEVELOP_REPO/releases/$ID" --silent; then
                # Deleting a release does not delete its underlying git tag -
                # without this, dangling tags with no release pile up forever.
                ENC_TAG=$(jq -rn --arg t "$TAG" '$t | @uri')
                gh api -X DELETE "repos/$DEVELOP_REPO/git/refs/tags/$ENC_TAG" --silent || \
                  echo "::warning::Release $TAG deleted but its tag ref could not be removed"
                if [ -d "$DIR" ]; then
                  git rm -rq "$DIR"
                  git commit -q -m "chore: prune manifest for deleted release $TAG"
                fi
                DELETE_COUNT=$((DELETE_COUNT + 1))
              else
                echo "::error::Failed to delete release $TAG (id $ID) — leaving its manifest in place"
              fi
            done
          done

          if [ "$DRY_RUN" != "true" ]; then
            git push
          fi
